<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="20" height="20">
  <!-- Outer Neon Square -->
  <rect 
    x="6" 
    y="6" 
    width="88" 
    height="88" 
    fill="none" 
    stroke="#00f0ff" 
    stroke-width="8"
  />
  
  <!-- Top Row Dots -->
  <circle cx="28" cy="28" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="42" cy="28" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="58" cy="28" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="72" cy="28" r="3" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Middle Rows Dots (Sides) -->
  <circle cx="28" cy="42" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="72" cy="42" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="28" cy="58" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="72" cy="58" r="3" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Bottom Row Dots -->
  <circle cx="28" cy="72" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="42" cy="72" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="58" cy="72" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="72" cy="72" r="3" fill="#00f0ff" opacity="0.8"/>
  
  <!-- Center Horizontal Dash -->
  <rect x="40" y="46" width="20" height="8" rx="2" fill="#00f0ff"/>
</svg>
